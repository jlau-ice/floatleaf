name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:check
      - run: pnpm build
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test:rust
      - run: pnpm exec playwright install chromium
      - run: pnpm test:web
      - if: runner.os == 'macOS'
        run: pnpm tauri build --debug --no-bundle
      - name: Reproduce v0.1.0 packaged Windows hide bug
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 -o "$env:RUNNER_TEMP/old-setup.exe" https://github.com/jlau-ice/floatleaf/releases/download/v0.1.0/FloatLeaf_0.1.0_x64-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z x "$env:RUNNER_TEMP/old-setup.exe" "-o$env:RUNNER_TEMP/floatleaf-old" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows-package-smoke.py "$env:RUNNER_TEMP/floatleaf-old/floatleaf.exe" --expect-stuck --output .local/windows-old.json
      - name: Build ordinary Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
      - name: Install and verify Windows native visibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP 'floatleaf-installed'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FloatLeaf' | Select-Object DisplayVersion, InstallLocation
          Get-ChildItem $installDirectory
          # Exercise the light settings caption even when this ephemeral runner prefers dark apps.
          $themeKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $themeKey -Force | Out-Null
          Set-ItemProperty -Path $themeKey -Name AppsUseLightTheme -Type DWord -Value 0
          python scripts/windows-package-smoke.py (Join-Path $installDirectory 'floatleaf.exe') --output .local/windows-fixed.json --screenshot .local/windows-settings.png --check-diagnostics
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-native-evidence
          include-hidden-files: true
          path: |
            .local/windows-*.json
            .local/windows-settings.png
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-runtime-logs
          path: ~/AppData/Roaming/io.github.jlauice.floatleaf/logs/*.log
