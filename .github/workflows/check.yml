name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:check
      - run: pnpm build
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test:rust
      - run: pnpm exec playwright install chromium
      - run: pnpm test:web
      - if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/v')
        run: pnpm tauri build --debug --no-bundle
      - name: Build macOS trial for a version tag
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: pnpm tauri build --bundles app,dmg
      - name: Verify macOS package
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: |
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/FloatLeaf.app
          hdiutil verify src-tauri/target/release/bundle/dmg/*.dmg
          strings src-tauri/target/release/bundle/macos/FloatLeaf.app/Contents/MacOS/floatleaf > "$RUNNER_TEMP/floatleaf-strings.txt"
          if grep -qE 'FLOATLEAF_(PROBE|DATA)_DIR' "$RUNNER_TEMP/floatleaf-strings.txt"; then
            echo 'Release app contains diagnostic entry points'
            exit 1
          fi
      - name: Reproduce v0.1.0 packaged Windows hide bug
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 -o "$env:RUNNER_TEMP/old-setup.exe" https://github.com/jlau-ice/floatleaf/releases/download/v0.1.0/FloatLeaf_0.1.0_x64-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z x "$env:RUNNER_TEMP/old-setup.exe" "-o$env:RUNNER_TEMP/floatleaf-old" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows-package-smoke.py "$env:RUNNER_TEMP/floatleaf-old/floatleaf.exe" --expect-stuck --output .local/windows-old.json
      - name: Build ordinary Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
      - name: Install and verify Windows native visibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP 'floatleaf-installed'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FloatLeaf' | Select-Object DisplayVersion, InstallLocation
          Get-ChildItem $installDirectory
          # Exercise the light settings caption even when this ephemeral runner prefers dark apps.
          $themeKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $themeKey -Force | Out-Null
          Set-ItemProperty -Path $themeKey -Name AppsUseLightTheme -Type DWord -Value 0
          python scripts/windows-package-smoke.py (Join-Path $installDirectory 'floatleaf.exe') --output .local/windows-fixed.json --screenshot .local/windows-settings.png --check-diagnostics --check-emergency-without-key --check-capture-protection
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-native-evidence
          include-hidden-files: true
          path: |
            .local/windows-*.json
            .local/windows-*.png
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-runtime-logs
          path: ~/AppData/Roaming/io.github.jlauice.floatleaf/logs/*.log
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: trial-installer-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*-setup.exe

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: trial-installer-*
          merge-multiple: true
          path: installers
      - name: Prepare trial files and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package-release.py "$RELEASE_TAG" installers release
      - name: Upload, verify, and publish trial
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --latest=false \
            --title "FloatLeaf $RELEASE_TAG · 试用版" --notes-file "docs/RELEASE_${RELEASE_TAG}.md"
          gh release download "$RELEASE_TAG" --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS.txt)
          for asset in release/*; do cmp "$asset" "downloaded/$(basename "$asset")"; done
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
