[package]
name = "floatleaf"
version = "0.2.1"
description = "FloatLeaf offline floating text reader"
edition = "2024"
rust-version = "1.99.1"

[lib]
name = "floatleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
diagnostics = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
sha2 = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.21.1"
scraper = { version = "0.27.0", default-features = false }
regex = "1.13.1"
percent-encoding = "2.3.2"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
